<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Job Parser - Graeme Suddick</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: bold;
        }

        .stat-badge.high { border-left: 4px solid #e74c3c; }
        .stat-badge.medium { border-left: 4px solid #f39c12; }
        .stat-badge.low { border-left: 4px solid #3498db; }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            min-height: 600px;
        }

        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-right: 2px solid #e0e0e0;
            overflow-y: auto;
            max-height: calc(100vh - 300px);
        }

        .filters {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .job-list {
            margin-top: 20px;
        }

        .job-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .job-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .job-item.high { border-left-color: #e74c3c; }
        .job-item.medium { border-left-color: #f39c12; }
        .job-item.low { border-left-color: #3498db; }
        .job-item.check { border-left-color: #95a5a6; }

        .job-item.selected {
            background: #e8f4f8;
            border-left-width: 6px;
        }

        .job-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .job-company {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 3px;
        }

        .job-score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .content-area {
            padding: 30px;
            overflow-y: auto;
            max-height: calc(100vh - 300px);
        }

        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .placeholder h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .job-details {
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .detail-header h2 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #7f8c8d;
            font-size: 0.95em;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-section h3 {
            color: #34495e;
            font-size: 1.3em;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            padding-left: 10px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: #ecf0f1;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #2c3e50;
        }

        .tag.skill { background: #e8f8f5; color: #16a085; }
        .tag.tech { background: #ebf5fb; color: #2980b9; }

        .priority-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .priority-badge.high {
            background: #e74c3c;
            color: white;
        }

        .priority-badge.medium {
            background: #f39c12;
            color: white;
        }

        .priority-badge.low {
            background: #3498db;
            color: white;
        }

        .priority-badge.check {
            background: #95a5a6;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .email-preview {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 2px solid #e0e0e0;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Gmail Job Parser</h1>
            <p>Windows/SCCM/Intune/Azure Specialist - Graeme Suddick</p>
        </div>

        <div class="toolbar">
            <div class="stats">
                <div class="stat-badge">
                    Total: <span id="stat-total">0</span>
                </div>
                <div class="stat-badge high">
                    🔴 High: <span id="stat-high">0</span>
                </div>
                <div class="stat-badge medium">
                    🟠 Medium: <span id="stat-medium">0</span>
                </div>
                <div class="stat-badge low">
                    🟡 Low: <span id="stat-low">0</span>
                </div>
            </div>

            <div class="buttons">
                <button class="btn btn-primary" onclick="fetchNewJobs()">
                    🔄 Fetch New Jobs
                </button>
                <button class="btn btn-success" onclick="exportJobs()">
                    💾 Export CSV
                </button>
                <button class="btn btn-secondary" onclick="showProfile()">
                    ⚙️ Profile
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="filters">
                    <h3 style="margin-bottom: 15px; color: #2c3e50;">Filters</h3>

                    <div class="filter-group">
                        <label>Priority</label>
                        <select id="filter-priority" onchange="applyFilters()">
                            <option value="all">All</option>
                            <option value="high">🔴 High</option>
                            <option value="medium">🟠 Medium</option>
                            <option value="low">🟡 Low</option>
                            <option value="check">⚪ Check</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Location</label>
                        <select id="filter-location" onchange="applyFilters()">
                            <option value="all">All</option>
                            <option value="remote">Remote</option>
                            <option value="north-east">North East</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Search</label>
                        <input type="text" id="filter-search" placeholder="Keywords..." onkeyup="applyFilters()">
                    </div>
                </div>

                <div class="job-list" id="job-list">
                    <div class="loading">Loading jobs</div>
                </div>
            </div>

            <div class="content-area" id="content-area">
                <div class="placeholder">
                    <h2>👈 Select a job to view details</h2>
                    <p>Click on any job from the list to see full information</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allJobs = [];
        let selectedJob = null;

        // Load jobs on page load
        window.onload = function() {
            loadJobs();
        };

        async function loadJobs() {
            try {
                const response = await fetch('/api/jobs');
                const data = await response.json();

                allJobs = data.jobs;
                updateStats(data.stats);
                applyFilters();
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('job-list').innerHTML =
                    '<div class="placeholder"><p>Error loading jobs</p></div>';
            }
        }

        function updateStats(stats) {
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-high').textContent = stats.high;
            document.getElementById('stat-medium').textContent = stats.medium;
            document.getElementById('stat-low').textContent = stats.low;
        }

        async function applyFilters() {
            const priority = document.getElementById('filter-priority').value;
            const location = document.getElementById('filter-location').value;
            const search = document.getElementById('filter-search').value;

            try {
                const response = await fetch('/api/filter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ priority, location, search })
                });

                const data = await response.json();
                displayJobs(data.jobs);
            } catch (error) {
                console.error('Error filtering jobs:', error);
            }
        }

        function displayJobs(jobs) {
            const jobList = document.getElementById('job-list');

            if (jobs.length === 0) {
                jobList.innerHTML = '<div class="placeholder"><p>No jobs match your filters</p></div>';
                return;
            }

            jobList.innerHTML = jobs.map(job => `
                <div class="job-item ${job.priority}" onclick="showJob('${job.email_id}')">
                    <div class="job-title">${job.position || 'Unknown Position'}</div>
                    <div class="job-company">
                        ${job.company || 'Unknown'} • ${job.location || 'Unknown'}
                    </div>
                    <div style="margin-top: 8px;">
                        <span class="job-score">${Math.round(job.relevance_score || 0)}% Match</span>
                    </div>
                </div>
            `).join('');
        }

        async function showJob(jobId) {
            try {
                const response = await fetch(`/api/jobs/${jobId}`);
                const job = await response.json();

                selectedJob = job;

                // Highlight selected
                document.querySelectorAll('.job-item').forEach(item => {
                    item.classList.remove('selected');
                });
                event.currentTarget.classList.add('selected');

                // Display details
                const priorityLabels = {
                    'high': '🔴 High Priority',
                    'medium': '🟠 Medium Priority',
                    'low': '🟡 Low Priority',
                    'check': '⚪ Review Needed'
                };

                document.getElementById('content-area').innerHTML = `
                    <div class="job-details">
                        <div class="detail-header">
                            <h2>${job.position || 'Unknown Position'}</h2>
                            <div class="detail-meta">
                                <span><strong>Company:</strong> ${job.company || 'Unknown'}</span>
                                <span><strong>Location:</strong> ${job.location || 'Unknown'}</span>
                                <span><strong>Type:</strong> ${job.job_type || 'Unknown'}</span>
                                ${job.salary ? `<span><strong>Salary:</strong> ${job.salary}</span>` : ''}
                            </div>
                            <div style="margin-top: 15px;">
                                <span class="priority-badge ${job.priority}">
                                    ${priorityLabels[job.priority] || 'Unknown'}
                                </span>
                                <span class="job-score" style="margin-left: 10px;">
                                    ${Math.round(job.relevance_score || 0)}% Match
                                </span>
                            </div>
                        </div>

                        ${job.matched_skills && job.matched_skills.length > 0 ? `
                        <div class="detail-section">
                            <h3>✓ Matched Skills</h3>
                            <div class="tags">
                                ${job.matched_skills.slice(0, 10).map(skill =>
                                    `<span class="tag skill">${skill}</span>`
                                ).join('')}
                            </div>
                        </div>
                        ` : ''}

                        ${job.matched_technologies && job.matched_technologies.length > 0 ? `
                        <div class="detail-section">
                            <h3>🔧 Matched Technologies</h3>
                            <div class="tags">
                                ${job.matched_technologies.slice(0, 10).map(tech =>
                                    `<span class="tag tech">${tech}</span>`
                                ).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <div class="detail-section">
                            <h3>📋 Description</h3>
                            <p>${job.description || 'No description available'}</p>
                        </div>

                        ${job.key_requirements ? `
                        <div class="detail-section">
                            <h3>📌 Key Requirements</h3>
                            <p>${Array.isArray(job.key_requirements) ?
                                job.key_requirements.map(req => `• ${req}`).join('<br>') :
                                job.key_requirements}</p>
                        </div>
                        ` : ''}

                        <div class="detail-section">
                            <h3>✉️ Email Details</h3>
                            <p><strong>Subject:</strong> ${job.email_subject || 'Unknown'}</p>
                            <p><strong>From:</strong> ${job.email_sender || 'Unknown'}</p>
                            <p><strong>Date:</strong> ${job.email_date || 'Unknown'}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading job details:', error);
            }
        }

        async function fetchNewJobs() {
            const maxEmails = prompt('How many emails to process?', '50');
            if (!maxEmails) return;

            try {
                document.getElementById('job-list').innerHTML =
                    '<div class="loading">Fetching new jobs from Gmail</div>';

                const response = await fetch('/api/fetch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ max_emails: parseInt(maxEmails) })
                });

                const data = await response.json();
                alert(data.message || 'Fetching jobs...');

                // Reload after delay
                setTimeout(loadJobs, 5000);
            } catch (error) {
                console.error('Error fetching jobs:', error);
                alert('Error: ' + error.message);
            }
        }

        async function exportJobs() {
            const priority = document.getElementById('filter-priority').value;

            try {
                const response = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ priority })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    alert(`Exported ${data.count} jobs to ${data.filename}`);
                } else {
                    alert('Export failed: ' + data.error);
                }
            } catch (error) {
                console.error('Error exporting:', error);
                alert('Export error: ' + error.message);
            }
        }

        async function showProfile() {
            try {
                const response = await fetch('/api/profile');
                const profile = await response.json();

                document.getElementById('content-area').innerHTML = `
                    <div class="job-details">
                        <div class="detail-header">
                            <h2>👤 CV Profile</h2>
                        </div>

                        <div class="detail-section">
                            <h3>Profile Information</h3>
                            <p><strong>Name:</strong> ${profile.name}</p>
                            <p>${profile.description}</p>
                        </div>

                        <div class="detail-section">
                            <h3>Statistics</h3>
                            <p><strong>Skills:</strong> ${profile.skills_count}</p>
                            <p><strong>Technologies:</strong> ${profile.technologies_count}</p>
                            <p><strong>Preferred Roles:</strong> ${profile.roles_count}</p>
                        </div>

                        <div class="detail-section">
                            <h3>Top Skills</h3>
                            <div class="tags">
                                ${profile.top_skills.map(skill =>
                                    `<span class="tag skill">${skill}</span>`
                                ).join('')}
                            </div>
                        </div>

                        <div class="detail-section">
                            <h3>Top Technologies</h3>
                            <div class="tags">
                                ${profile.top_technologies.map(tech =>
                                    `<span class="tag tech">${tech}</span>`
                                ).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
    </script>
</body>
</html>
