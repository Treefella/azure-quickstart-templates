<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Job Parser - Real-Time Processing</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        /* Progress Section */
        .progress-info {
            margin-bottom: 20px;
        }

        .progress-bar-container {
            background: #f0f0f0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .status-box strong {
            color: #667eea;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Jobs List */
        .jobs-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .job-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .job-card.high {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .job-card.medium {
            border-left-color: #fd7e14;
            background: #fff8f0;
        }

        .job-card.low {
            border-left-color: #ffc107;
            background: #fffbf0;
        }

        .job-card.check {
            border-left-color: #6c757d;
            background: #f8f9fa;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .job-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .job-priority {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
        }

        .job-priority.high { background: #dc3545; }
        .job-priority.medium { background: #fd7e14; }
        .job-priority.low { background: #ffc107; color: #333; }
        .job-priority.check { background: #6c757d; }

        .job-company {
            color: #666;
            margin: 5px 0;
        }

        .job-location {
            color: #999;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .job-score {
            font-size: 1.1em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .job-skills {
            color: #666;
            font-size: 0.9em;
            font-style: italic;
        }

        /* Start Button */
        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
        }

        .start-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .pulsing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Gmail Job Parser - Real-Time Processing</h1>

        <div class="dashboard">
            <!-- Left Panel: Progress & Stats -->
            <div class="panel">
                <h2>📊 Processing Status</h2>

                <button id="startButton" class="start-button" onclick="startProcessing()">
                    🚀 Start Processing Last Month
                </button>

                <div class="progress-info">
                    <div class="status-box">
                        <strong>Status:</strong> <span id="status">Idle</span>
                    </div>

                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar" style="width: 0%">
                            <span id="progressText">0%</span>
                        </div>
                    </div>

                    <div class="status-box" id="currentEmail" style="display: none;">
                        <strong>Current Email:</strong><br>
                        <span id="emailSubject"></span>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">📈 Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">💼 Jobs Found</div>
                        <div class="stat-number" id="statJobs">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">✅ Confirmations</div>
                        <div class="stat-number" id="statConfirmations">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">🔄 Duplicates</div>
                        <div class="stat-number" id="statDuplicates">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">⚪ Non-Jobs</div>
                        <div class="stat-number" id="statNonJobs">0</div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Jobs List -->
            <div class="panel">
                <h2>💼 Jobs Found (<span id="jobCount">0</span>)</h2>

                <div class="jobs-list" id="jobsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No jobs found yet.</p>
                        <p>Click "Start Processing" to begin!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let isProcessing = false;

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('update', (data) => {
            updateUI(data);
        });

        socket.on('processing_started', (data) => {
            console.log('Processing started');
        });

        function updateUI(state) {
            // Update status
            document.getElementById('status').textContent = state.status;

            // Update progress
            const progress = state.progress;
            const percentage = progress.total > 0 ? Math.round((progress.current / progress.total) * 100) : 0;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = percentage + '%';

            // Update current email
            if (state.current_email) {
                document.getElementById('currentEmail').style.display = 'block';
                document.getElementById('emailSubject').textContent = state.current_email.subject;
            } else {
                document.getElementById('currentEmail').style.display = 'none';
            }

            // Update stats
            document.getElementById('statJobs').textContent = state.stats.new_jobs;
            document.getElementById('statConfirmations').textContent = state.stats.confirmations;
            document.getElementById('statDuplicates').textContent = state.stats.duplicates;
            document.getElementById('statNonJobs').textContent = state.stats.non_jobs;

            // Update jobs list
            updateJobsList(state.jobs);

            // Update button state
            isProcessing = state.is_processing;
            const button = document.getElementById('startButton');
            button.disabled = isProcessing;
            if (isProcessing) {
                button.textContent = '⏳ Processing...';
                button.classList.add('pulsing');
            } else {
                button.textContent = '🚀 Start Processing Last Month';
                button.classList.remove('pulsing');
            }
        }

        function updateJobsList(jobs) {
            const jobsList = document.getElementById('jobsList');
            document.getElementById('jobCount').textContent = jobs.length;

            if (jobs.length === 0) {
                jobsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No jobs found yet.</p>
                        <p>Click "Start Processing" to begin!</p>
                    </div>
                `;
                return;
            }

            jobsList.innerHTML = jobs.map(job => `
                <div class="job-card ${job.priority_class}">
                    <div class="job-header">
                        <div class="job-title">${escapeHtml(job.position)}</div>
                        <div class="job-priority ${job.priority_class}">${job.priority}</div>
                    </div>
                    <div class="job-company">🏢 ${escapeHtml(job.company)}</div>
                    <div class="job-location">📍 ${escapeHtml(job.location)}</div>
                    <div class="job-score">🎯 ${job.relevance_score}% Match</div>
                    ${job.matched_skills ? `<div class="job-skills">Skills: ${escapeHtml(job.matched_skills)}</div>` : ''}
                </div>
            `).join('');
        }

        function startProcessing() {
            if (!isProcessing) {
                socket.emit('start_processing', {});
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
