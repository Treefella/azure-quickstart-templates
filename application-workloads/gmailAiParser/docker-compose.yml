version: '3.8'

services:
  # Ollama service for running LLM models
  ollama:
    image: ollama/ollama:latest
    container_name: gmail-job-parser-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - job-parser-network

  # Model initialization service - pulls required models on startup
  ollama-init:
    image: ollama/ollama:latest
    container_name: gmail-job-parser-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./init-models.sh:/init-models.sh
    entrypoint: ["/bin/sh", "/init-models.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - job-parser-network

  # Gmail Job Parser application
  job-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmail-job-parser-app
    depends_on:
      - ollama-init
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_JOB_DETECTION_MODEL=llama3.2
      - OLLAMA_JOB_EXTRACTION_MODEL=llama3.2
      - OLLAMA_CONFIRMATION_MODEL=llama3.2
      - LOG_LEVEL=INFO
    networks:
      - job-parser-network
    stdin_open: true
    tty: true
    command: ["python", "main.py", "--max-emails", "50"]

volumes:
  ollama_models:
    driver: local

networks:
  job-parser-network:
    driver: bridge
